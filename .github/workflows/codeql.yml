name: CodeQL

# Static analysis of the four shipping packages with GitHub's C# CodeQL queries, including the
# security-extended suite. Results appear under Security > Code scanning. The build is explicit
# (build-mode: manual) so CodeQL analyses exactly what ships: the src/ projects on both target
# frameworks, not the tests, samples or benchmarks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries run against unchanged code too. Monday 04:29 UTC.
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # The 10.0 SDK compiles both target frameworks; nothing is executed, so no 8.0 runtime is needed.
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      # UseSharedCompilation=false keeps every compilation in a process CodeQL traces; a compiler server
      # left over from an earlier build would compile outside the trace and the code would go unanalysed.
      # The LittleCms project builds without its native runtime, which only packing requires.
      - name: Build the shipping projects
        run: |
          set -euo pipefail
          for name in EasyImageSharp EasyImageSharp.AI EasyImageSharp.SkiaSharp EasyImageSharp.LittleCms; do
            dotnet build "src/$name/$name.csproj" -c Release -p:UseSharedCompilation=false
          done

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:csharp"
