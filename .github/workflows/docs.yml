name: Docs

# Builds the documentation site in docs/site with DocFX: the API reference generated from the XML
# documentation of all four packages, plus the repository's own Markdown (README.md, docs/*.md, the
# package and tool READMEs, the changelog and the policy files), staged by docs/site/build.ps1. Pull
# requests build it so a broken site is caught in review; main also deploys it to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "src/**"
      - "docs/**"
      - "benchmarks/**/*.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "src/**"
      - "docs/**"
      - "benchmarks/**/*.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # DocFX loads the projects for net10.0 only; the 10.0 SDK is all it needs.
          dotnet-version: 10.0.x

      # Restores DocFX from .config/dotnet-tools.json, stages the repository Markdown and builds the site
      # into docs/site/_site. DocFX warnings (mostly links to files the site does not publish) are
      # reported in the log and do not fail the job.
      - name: Build the site
        shell: pwsh
        run: ./docs/site/build.ps1

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment half-way; a newer run waits for this one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
