name: Docs

# Builds the documentation site in docs/site with DocFX: the API reference generated from the XML
# documentation of the packages, plus the repository's own Markdown (README.md, docs/*.md, the package and
# tool READMEs, the changelog and the policy files), staged by docs/site/build.ps1. It only checks that the
# site builds, so a broken site is caught in review; nothing is deployed. To publish it later, add an
# upload-pages-artifact step and a deploy-pages job after enabling Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "src/**"
      - "docs/**"
      - "benchmarks/**/*.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "src/**"
      - "docs/**"
      - "benchmarks/**/*.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # DocFX loads the projects for net10.0 only; the 10.0 SDK is all it needs.
          dotnet-version: 10.0.x

      # Restores DocFX from .config/dotnet-tools.json, stages the repository Markdown and builds the site
      # into docs/site/_site. DocFX warnings (mostly links to files the site does not publish) are
      # reported in the log and do not fail the job.
      - name: Build the site
        shell: pwsh
        run: ./docs/site/build.ps1
