blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/FarhanLodi/EasyImageSharp/security/advisories/new
    about: >-
      Never report a security problem in a public issue. Use private vulnerability reporting instead.
      See SECURITY.md for the decoder threat model and what counts as a vulnerability.
  - name: Question or usage help
    url: https://github.com/FarhanLodi/EasyImageSharp/discussions
    about: >-
      "How do I ...?" belongs in Discussions. Issues are for defects and concrete proposals.
  - name: Code of Conduct concern
    url: https://github.com/FarhanLodi/EasyImageSharp/blob/main/CODE_OF_CONDUCT.md
    about: Report conduct concerns privately to the maintainer, not in a public issue.
